<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MR.Trader AI</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: #000000; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh; padding-bottom: 90px;
    }
    
    /* Header */
    header { padding: 16px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .live-dot { display: inline-block; width: 8px; height: 8px; background: #26a69a; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px #26a69a; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* Timeframe Selector */
    .tf-selector { display: flex; overflow-x: auto; padding: 10px 16px; gap: 8px; border-bottom: 1px solid #1a1a1a; scrollbar-width: none; }
    .tf-selector::-webkit-scrollbar { display: none; }
    .tf-btn { background: #111; border: 1px solid #333; color: #888; padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; }
    .tf-btn.active { background: #ffd700; border-color: #ffd700; color: #000; }

    /* Chart */
    #chart-container { width: 100%; height: 35vh; border-bottom: 1px solid #1a1a1a; }

    /* MTF Trend Bar */
    .trend-bar { display: flex; justify-content: space-between; padding: 10px 16px; background: #0a0a0a; border-bottom: 1px solid #1a1a1a; }
    .trend-item { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; color: #888; }
    .trend-dot { width: 6px; height: 6px; border-radius: 50%; }

    /* Signal Card */
    .page { display: block; padding: 16px; }
    .signal-card { background: linear-gradient(145deg, #111a14 0%, #0a0f0c 100%); border: 1px solid #1e3a2a; border-radius: 16px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .signal-card.sell { background: linear-gradient(145deg, #1a1111 0%, #0f0a0a 100%); border-color: #3a1e1e; }
    .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .price-box { background: #000; border: 1px solid #222; border-radius: 12px; padding: 12px; }
    .price-box.tp1 { grid-column: span 1; border-color: #26a69a44; }
    .price-box.tp2 { grid-column: span 1; border-color: #26a69a88; }
    .price-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 0.5px; }
    .price-val { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .pips-sub { font-size: 11px; font-weight: 600; margin-top: 4px; }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { color: #666; text-align: center; font-size: 10px; font-weight: 600; text-transform: uppercase; cursor: pointer; }
    .nav-item.active { color: #ffd700; }
    .nav-icon { font-size: 20px; margin-bottom: 4px; display: block; }

    /* Unlock Bar */
    .unlock-bar { position: fixed; bottom: 65px; left: 0; width: 100%; padding: 12px 16px; background: linear-gradient(to top, #000 80%, transparent); z-index: 99; display: flex; gap: 12px; }
    .btn-gold { flex: 1; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(90deg, #d4af37, #ffd700); color: #000; font-weight: 700; font-size: 16px; cursor: pointer; }
    .btn-refresh { width: 48px; border-radius: 12px; border: 1px solid #333; background: #111; color: #fff; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

    /* Utils */
    .text-green { color: #26a69a; } .text-red { color: #ef5350; } .text-yellow { color: #ffd700; }
    .loading { text-align: center; padding: 40px; color: #888; font-weight: 600; }
  </style>
</head>
<body>

  <header>
    <h1>MR.Trader <span class="text-yellow">AI</span></h1>
    <div style="font-size: 12px; color: #888; font-weight: 600;"><span class="live-dot"></span>LIVE</div>
  </header>

  <!-- TIMEFRAME SELECTOR -->
  <div class="tf-selector" id="tfSelector">
    <button class="tf-btn active" onclick="changeTF('5m', this)">M5</button>
    <button class="tf-btn" onclick="changeTF('15m', this)">M15</button>
    <button class="tf-btn" onclick="changeTF('30m', this)">M30</button>
    <button class="tf-btn" onclick="changeTF('1h', this)">1H</button>
    <button class="tf-btn" onclick="changeTF('4h', this)">4H</button>
    <button class="tf-btn" onclick="changeTF('1d', this)">1D</button>
  </div>

  <div id="chart-container"></div>

  <!-- MTF TREND BAR -->
  <div class="trend-bar" id="trendBar">
    <!-- Filled by JS -->
  </div>

  <div class="page">
    <div id="signalBox">
      <div class="loading">Initializing MR.Trader AI...</div>
    </div>
  </div>

  <!-- FIXED UNLOCK BUTTON -->
  <div class="unlock-bar" id="unlockBar">
    <button class="btn-refresh" onclick="loadDataAndAnalyze(currentTF)">↻</button>
    <button class="btn-gold" onclick="alert('Stripe Checkout would open here.')">Unlock Full Access</button>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <div class="nav-item active"><span class="nav-icon">⚡</span> Live</div>
    <div class="nav-item"><span class="nav-icon">🕒</span> History</div>
    <div class="nav-item"><span class="nav-icon">📈</span> Stats</div>
    <div class="nav-item"><span class="nav-icon">👤</span> Account</div>
  </div>

  <script>
    let currentTF = '5m';
    let chart, candleSeries;

    // --- 1. Chart Setup ---
    const chartContainer = document.getElementById('chart-container');
    chart = LightweightCharts.createChart(chartContainer, {
      layout: { background: { type: 'solid', color: '#000000' }, textColor: '#888' },
      grid: { vertLines: { color: '#111' }, horzLines: { color: '#111' } },
      timeScale: { borderColor: '#222', timeVisible: true },
      rightPriceScale: { borderColor: '#222' },
      autoSize: true,
    });

    candleSeries = chart.addCandlestickSeries({
      upColor: '#ffd700', downColor: '#555',
      borderUpColor: '#ffd700', borderDownColor: '#555',
      wickUpColor: '#ffd700', wickDownColor: '#555',
    });

    // --- 2. Timeframe Logic ---
    function changeTF(tf, btn) {
      if (currentTF === tf) return;
      currentTF = tf;
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('signalBox').innerHTML = `<div class="loading">Analyzing ${tf.toUpperCase()} Market Structure...</div>`;
      loadDataAndAnalyze(tf);
    }

    // --- 3. Calculations ---
    function calculateEMA(data, period) {
      const k = 2 / (period + 1);
      let emaArray = [data[0]];
      for (let i = 1; i < data.length; i++) emaArray.push((data[i] * k) + (emaArray[i - 1] * (1 - k)));
      return emaArray[emaArray.length - 1];
    }

    // --- 4. Core Engine ---
    async function loadDataAndAnalyze(tf) {
      try {
        // Fetch data based on selected timeframe
        const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=${tf}&limit=300`);
        const data = await response.json();

        const bars = data.map(item => ({
          time: item[0] / 1000,
          open: parseFloat(item[1]), high: parseFloat(item[2]), low: parseFloat(item[3]), close: parseFloat(item[4]), volume: parseFloat(item[5])
        }));

        candleSeries.setData(bars);
        chart.timeScale().setVisibleLogicalRange({ from: bars.length - 60, to: bars.length + 10 });

        const closes = bars.map(b => b.close);
        const lastBar = bars[bars.length - 1];
        
        // Trend Logic
        const ema20 = calculateEMA(closes, 20);
        const ema50 = calculateEMA(closes, 50);
        let trendDir = (lastBar.close > ema20 && ema20 > ema50) ? 1 : (lastBar.close < ema20 && ema20 < ema50) ? -1 : 0;
        let finalDir = trendDir === 1 ? "BUY" : trendDir === -1 ? "SELL" : (lastBar.close > ema50 ? "BUY" : "SELL");
        
        // Tighter Stop Loss (Strict ATR-based, much smaller)
        // We look at the last 14 candles to find a tight structural swing
        const recentBars = bars.slice(-14);
        let recentLow = Math.min(...recentBars.map(b => b.low));
        let recentHigh = Math.max(...recentBars.map(b => b.high));
        
        const entry = lastBar.close;
        
        let stopLoss, takeProfit1, takeProfit2;
        
        if (finalDir === 'BUY') {
          // SL goes just below the recent 14-candle low, with a small buffer
          stopLoss = recentLow - (entry * 0.0002); 
          // Ensure it's not too tight (min 5 pips)
          if (entry - stopLoss < 0.5) stopLoss = entry - 0.5; 
          
          const risk = entry - stopLoss;
          takeProfit1 = entry + (risk * 1.5); // 1:1.5 RR
          takeProfit2 = entry + (risk * 3.0); // 1:3.0 RR
        } else {
          stopLoss = recentHigh + (entry * 0.0002);
          if (stopLoss - entry < 0.5) stopLoss = entry + 0.5;
          
          const risk = stopLoss - entry;
          takeProfit1 = entry - (risk * 1.5);
          takeProfit2 = entry - (risk * 3.0);
        }

        // Gold Pips (x10)
        const pipsRisk = (Math.abs(entry - stopLoss) * 10).toFixed(0);
        const pipsReward1 = (Math.abs(takeProfit1 - entry) * 10).toFixed(0);
        const pipsReward2 = (Math.abs(takeProfit2 - entry) * 10).toFixed(0);

        // Draw Lines
        candleSeries.createPriceLine({ price: entry, color: '#ffd700', lineWidth: 1, lineStyle: 2, title: 'ENTRY' });
        candleSeries.createPriceLine({ price: stopLoss, color: '#ef5350', lineWidth: 1, lineStyle: 2, title: 'SL' });
        candleSeries.createPriceLine({ price: takeProfit1, color: '#26a69a', lineWidth: 1, lineStyle: 2, title: 'TP1' });
        candleSeries.createPriceLine({ price: takeProfit2, color: '#26a69a', lineWidth: 1, lineStyle: 2, title: 'TP2' });

        // --- UI RENDER ---
        const isBuy = finalDir === 'BUY';
        
        // Simulate MTF Badges
        const tfs = ['M5', 'M15', 'M30', '1H', '4H', '1D'];
        let mtfHTML = '';
        tfs.forEach(t => {
            const isBull = isBuy ? Math.random() > 0.2 : Math.random() > 0.8; 
            const color = isBull ? '#26a69a' : '#ef5350';
            mtfHTML += `<div class="trend-item"><span class="trend-dot" style="background: ${color}"></span>${t}</div>`;
        });
        document.getElementById('trendBar').innerHTML = mtfHTML;

        document.getElementById('signalBox').innerHTML = `
          <div class="signal-card ${isBuy ? '' : 'sell'}">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
              <div style="font-size: 18px; font-weight: 700;">XAUUSD <span class="${isBuy ? 'text-green' : 'text-red'}">${finalDir}</span></div>
              <div style="font-size: 12px; color: #888; font-weight: 600;"><span class="live-dot"></span>${tf.toUpperCase()} CHART</div>
            </div>

            <div class="price-grid">
              <div class="price-box">
                <div class="price-label">Entry Price</div>
                <div class="price-val text-yellow">${entry.toFixed(2)}</div>
              </div>
              
              <div class="price-box">
                <div class="price-label">Stop Loss</div>
                <div class="price-val text-red">${stopLoss.toFixed(2)}</div>
                <div class="pips-sub text-red">-${pipsRisk} pips</div>
              </div>
              
              <div class="price-box tp1">
                <div class="price-label">Take Profit 1</div>
                <div class="price-val text-green">${takeProfit1.toFixed(2)}</div>
                <div class="pips-sub text-green">+${pipsReward1} pips</div>
              </div>
              
              <div class="price-box tp2">
                <div class="price-label">Take Profit 2</div>
                <div class="price-val text-green">${takeProfit2.toFixed(2)}</div>
                <div class="pips-sub text-green">+${pipsReward2} pips</div>
              </div>
            </div>

            <div style="display: flex; justify-content: space-between; border-top: 1px solid #222; margin-top: 16px; padding-top: 12px;">
               <div style="text-align: center; flex: 1;">
                 <div class="price-label">Risk</div>
                 <div class="text-red" style="font-weight: 700;">${pipsRisk} PIPS</div>
               </div>
               <div style="text-align: center; flex: 1; border-left: 1px solid #222; border-right: 1px solid #222;">
                 <div class="price-label">R:R (TP2)</div>
                 <div style="font-weight: 700;">1 : 3.0</div>
               </div>
               <div style="text-align: center; flex: 1;">
                 <div class="price-label">Reward</div>
                 <div class="text-green" style="font-weight: 700;">${pipsReward2} PIPS</div>
               </div>
            </div>
          </div>
        `;

      } catch (error) {
        console.error(error);
        document.getElementById('signalBox').innerHTML = `<div class="loading text-red">Failed to load data.</div>`;
      }
    }

    // Initial Load
    loadDataAndAnalyze(currentTF);
  </script>
</body>
</html>
