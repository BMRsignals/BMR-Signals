<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MR.Trader AI</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: #000000; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh; padding-bottom: 90px;
    }
    
    body.rtl { direction: rtl; }
    
    /* Login Screen */
    #loginScreen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: #000; z-index: 1000; display: flex; flex-direction: column;
      justify-content: center; align-items: center; padding: 20px;
    }
    .login-box { width: 100%; max-width: 400px; background: #111; border: 1px solid #222; border-radius: 16px; padding: 24px; text-align: center; }
    .login-input { width: 100%; padding: 14px; margin-bottom: 12px; background: #000; border: 1px solid #333; color: #fff; border-radius: 8px; font-size: 14px; }
    .btn-primary { width: 100%; padding: 14px; border-radius: 8px; border: none; font-size: 16px; font-weight: 700; cursor: pointer; background: #ffd700; color: #000; margin-bottom: 10px; }
    .btn-secondary { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #ffd700; font-size: 16px; font-weight: 700; cursor: pointer; background: transparent; color: #ffd700; }
    .forgot-link { color: #888; font-size: 12px; text-decoration: underline; cursor: pointer; margin-top: 10px; display: block; }
    
    /* App Pages */
    .page { display: none; padding: 16px; animation: fadeIn 0.3s; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    header { padding: 16px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }

    .tf-selector { display: flex; overflow-x: auto; padding: 10px 16px; gap: 8px; border-bottom: 1px solid #1a1a1a; scrollbar-width: none; }
    .tf-selector::-webkit-scrollbar { display: none; }
    .tf-btn { background: #111; border: 1px solid #333; color: #888; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
    .tf-btn.active { background: #ffd700; border-color: #ffd700; color: #000; }

    .btn-analyze { width: 100%; padding: 16px; background: #222; color: #fff; border: none; border-top: 1px solid #333; font-size: 16px; font-weight: 700; cursor: pointer; }
    .btn-analyze:active { background: #ffd700; color: #000; }

    #chart-container { width: 100%; height: 35vh; border-bottom: 1px solid #1a1a1a; }

    .signal-card { background: linear-gradient(145deg, #111a14 0%, #0a0f0c 100%); border: 1px solid #1e3a2a; border-radius: 16px; padding: 16px; margin-top: 16px; }
    .signal-card.sell { background: linear-gradient(145deg, #1a1111 0%, #0f0a0a 100%); border-color: #3a1e1e; }
    .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .price-box { background: #000; border: 1px solid #222; border-radius: 12px; padding: 12px; }
    .price-box.tp1 { border-color: #26a69a44; }
    .price-box.tp2 { border-color: #26a69a88; }
    .price-label { font-size: 11px; color: #888; font-weight: 600; text-transform: uppercase; }
    .price-val { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .pips-sub { font-size: 11px; font-weight: 600; margin-top: 4px; }
    
    .status-badge { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; display: inline-block; margin-top: 8px; }
    .status-pending { background: #ffd70022; color: #ffd700; border: 1px solid #ffd70055; }
    .status-active-buy { background: #26a69a22; color: #26a69a; border: 1px solid #26a69a55; }
    .status-active-sell { background: #ef535022; color: #ef5350; border: 1px solid #ef535055; }

    .text-green { color: #26a69a; } .text-red { color: #ef5350; } .text-yellow { color: #ffd700; }
    .loading { text-align: center; padding: 40px; color: #888; font-weight: 600; }

    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { color: #666; text-align: center; font-size: 11px; font-weight: 700; text-transform: uppercase; cursor: pointer; }
    .nav-item.active { color: #ffd700; }
    .nav-icon { font-size: 20px; margin-bottom: 4px; display: block; }

    .lang-btn { background: #222; border: 1px solid #444; color: #ffd700; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer; }

    /* Performance Stats */
    .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 20px; }
    .stat-box { background: #111; border: 1px solid #222; border-radius: 12px; padding: 12px; text-align: center; }
    .stat-title { font-size: 10px; color: #888; text-transform: uppercase; font-weight: 700; }
    .stat-value { font-size: 20px; font-weight: 700; margin-top: 4px; }

    /* History List */
    .history-item { background: #111; border: 1px solid #222; border-radius: 12px; padding: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    .history-title { font-weight: 700; font-size: 14px; }
    .history-date { font-size: 11px; color: #888; }
    .history-result { font-weight: 700; font-size: 14px; text-align: right;}
  </style>
</head>
<body id="mainBody">

  <div id="loginScreen">
    <div class="login-box" id="loginBox">
      <h2 style="color: #ffd700; margin-bottom: 20px;">MR.Trader AI</h2>
      <input type="email" id="emailInput" class="login-input" placeholder="Enter your email">
      <input type="password" id="passwordInput" class="login-input" placeholder="Enter password">
      <button class="btn-primary" onclick="loginUser()">Login</button>
      <button class="btn-secondary" onclick="signUpUser()">Create Account</button>
      <a class="forgot-link" onclick="showForgotPassword()">Forgot Password?</a>
    </div>
    <div class="login-box" id="forgotBox" style="display: none;">
      <h2 style="color: #ffd700; margin-bottom: 20px;">Reset Password</h2>
      <input type="email" id="resetEmailInput" class="login-input" placeholder="Enter your email">
      <button class="btn-primary" onclick="sendResetEmail()">Send Reset Link</button>
      <a class="forgot-link" onclick="showLogin()">Back to Login</a>
    </div>
    <div class="login-box" id="newPasswordBox" style="display: none;">
      <h2 style="color: #ffd700; margin-bottom: 20px;">Set New Password</h2>
      <input type="password" id="newPasswordInput" class="login-input" placeholder="Enter new password">
      <button class="btn-primary" onclick="updatePassword()">Update Password</button>
    </div>
  </div>

  <div id="appContent" style="display: none;">
    <header>
      <h1>MR.Trader <span class="text-yellow">AI</span></h1>
      <div id="trialText" style="font-size: 12px; color: #888; font-weight: 600;">Tries left: 5</div>
    </header>

    <div id="page-live" class="page active" style="padding: 0;">
      <div class="tf-selector" id="tfSelector">
        <button class="tf-btn active" onclick="selectTF('5min', this)">M5</button>
        <button class="tf-btn" onclick="selectTF('15min', this)">M15</button>
        <button class="tf-btn" onclick="selectTF('30min', this)">M30</button>
        <button class="tf-btn" onclick="selectTF('1h', this)">1H</button>
        <button class="tf-btn" onclick="selectTF('4h', this)">4H</button>
        <button class="tf-btn" onclick="selectTF('1day', this)">1D</button>
      </div>
      <button class="btn-analyze" id="btnAnalyze" onclick="startAnalysis()">⚡ ANALYZE MARKET</button>
      <div id="chart-container"></div>
      <div style="padding: 16px;">
        <div id="signalBox"><div class="loading" id="loadingText">Loading saved data...</div></div>
      </div>
    </div>

    <div id="page-history" class="page">
      <h2 style="font-size: 18px; margin-bottom: 16px;">Performance & History</h2>
      <div class="stats-grid">
        <div class="stat-box"><div class="stat-title">Win Rate</div><div class="stat-value text-green" id="statWinRate">0%</div></div>
        <div class="stat-box"><div class="stat-title">Total Trades</div><div class="stat-value" id="statTotalTrades">0</div></div>
        <div class="stat-box"><div class="stat-title">Total Pips</div><div class="stat-value text-yellow" id="statTotalPips">0</div></div>
      </div>
      <div id="historyList"><div class="loading">No previous trades.</div></div>
    </div>

    <div id="page-account" class="page">
      <h2 style="font-size: 18px; margin-bottom: 16px;">Account Settings</h2>
      <div style="background: #111; border: 1px solid #222; border-radius: 12px; padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <span style="font-weight: 600;">Language / اللغة</span>
        <button class="lang-btn" id="langBtn2" onclick="toggleLanguage()">AR</button>
      </div>
      <div style="background: #111; border: 1px solid #222; border-radius: 12px; padding: 16px;">
        <div style="font-size: 12px; color: #888; margin-bottom: 4px;">Logged in as:</div>
        <div id="userEmail" style="font-weight: 600; font-size: 14px; margin-bottom: 16px;">...</div>
        <button onclick="logout()" style="width: 100%; padding: 12px; background: #ef535022; color: #ef5350; border: 1px solid #ef535055; border-radius: 8px; font-weight: 700; cursor: pointer;">Log Out</button>
      </div>
    </div>

    <div class="bottom-nav">
      <div class="nav-item active" onclick="switchTab('live', this)"><span class="nav-icon">⚡</span> <span class="nav-text">Live</span></div>
      <div class="nav-item" onclick="switchTab('history', this)"><span class="nav-icon">🕒</span> <span class="nav-text">History</span></div>
      <div class="nav-item" onclick="switchTab('account', this)"><span class="nav-icon">👤</span> <span class="nav-text">Account</span></div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wdexwfoplycblaxmrfws.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_6U7d-ihEr1ivc362mhkDeQ_2suPM3gy';
    const TWELVEDATA_API_KEY = 'a76abacdca7b4bd39dbf6caf65654e6a'; 

    let supabaseClient = null;
    let isRecoveryMode = false; 
    let chart, candleSeries;
    let priceLines = [];
    let currentLang = localStorage.getItem('lang') || 'en';
    let currentTF = '5min';
    let liveInterval;
    let userTries = 5; 

    let activeTrade = null;
    let tradeHistory = [];
    try {
      const savedActive = localStorage.getItem('activeTrade');
      if (savedActive) activeTrade = JSON.parse(savedActive);
      const savedHistory = localStorage.getItem('tradeHistory');
      if (savedHistory) tradeHistory = JSON.parse(savedHistory);
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has('t')) activeTrade = JSON.parse(decodeURIComponent(urlParams.get('t')));
    } catch (e) {}

    window.onload = function() {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      
      const hash = window.location.hash;
      if (hash && hash.includes('type=recovery')) {
        isRecoveryMode = true;
        document.getElementById('loginBox').style.display = 'none';
        document.getElementById('forgotBox').style.display = 'none';
        document.getElementById('newPasswordBox').style.display = 'block';
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appContent').style.display = 'none';
      } else {
        checkUser();
      }
    };

    function showForgotPassword() { document.getElementById('loginBox').style.display = 'none'; document.getElementById('forgotBox').style.display = 'block'; }
    function showLogin() { document.getElementById('loginBox').style.display = 'block'; document.getElementById('forgotBox').style.display = 'none'; document.getElementById('newPasswordBox').style.display = 'none'; }

    async function loginUser() {
      if (!supabaseClient) return;
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      if (!email || !password) return alert('Please enter email and password.');
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) alert("Login Error: " + error.message);
      else checkUser();
    }

    async function signUpUser() {
      if (!supabaseClient) return;
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      if (!email || !password) return alert('Please enter email and password.');
      const { error } = await supabaseClient.auth.signUp({ 
        email, 
        password,
        options: { data: { tries_left: 5 } }
      });
      if (error) alert("Sign Up Error: " + error.message);
      else alert('Account created! You can now click Login.');
    }

    async function sendResetEmail() {
      if (!supabaseClient) return;
      const email = document.getElementById('resetEmailInput').value;
      if (!email) return alert('Please enter your email.');
      const { error } = await supabaseClient.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + window.location.pathname });
      if (error) alert("Error: " + error.message);
      else { alert('Reset link sent! Check your email.'); showLogin(); }
    }

    async function updatePassword() {
      if (!supabaseClient) return;
      const newPassword = document.getElementById('newPasswordInput').value;
      if (!newPassword || newPassword.length < 6) return alert('Password must be at least 6 characters.');
      const { error } = await supabaseClient.auth.updateUser({ password: newPassword });
      if (error) alert("Error: " + error.message);
      else {
        alert('Password updated successfully! You are now logged in.');
        isRecoveryMode = false; 
        window.history.replaceState(null, null, window.location.pathname); 
        checkUser();
      }
    }

    async function logout() {
      if (!supabaseClient) return;
      await supabaseClient.auth.signOut();
      window.location.reload();
    }

    async function checkUser() {
      if (!supabaseClient || isRecoveryMode) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('loginScreen').style.display = 'none';
        document.getElementById('appContent').style.display = 'block';
        document.getElementById('userEmail').innerText = session.user.email;
        
        if (session.user.user_metadata && session.user.user_metadata.tries_left !== undefined) {
          userTries = session.user.user_metadata.tries_left;
        } else {
          userTries = 5;
        }
        updateTryText();

        initApp();
      } else {
        document.getElementById('loginScreen').style.display = 'flex';
        document.getElementById('appContent').style.display = 'none';
      }
    }

    function updateTryText() {
      const el = document.getElementById('trialText');
      if (userTries > 0) {
        el.innerText = `Tries left: ${userTries}`;
        el.style.color = '#888';
      } else {
        el.innerText = `Free trial ended`;
        el.style.color = '#ef5350';
      }
    }

    const dict = {
      en: { analyze: "⚡ ANALYZE MARKET", loading: "Select a timeframe and click Analyze.", scanning: "Scanning Market Structure...", buy: "BUY LIMIT", sell: "SELL LIMIT", activeBuy: "ACTIVE BUY", activeSell: "ACTIVE SELL", pending: "PENDING (WAIT)", entry: "SNIPER ENTRY", sl: "STOP LOSS", tp1: "TAKE PROFIT 1", tp2: "TAKE PROFIT 2", live: "Live", account: "Account", history: "History", noHistory: "No previous trades yet." },
      ar: { analyze: "⚡ تحليل السوق", loading: "اختر الفريم واضغط تحليل.", scanning: "جاري تحليل هيكل السوق...", buy: "شراء معلق", sell: "بيع معلق", activeBuy: "شراء نشط", activeSell: "بيع نشط", pending: "معلق (انتظار)", entry: "الدخول", sl: "وقف خسارة", tp1: "هدف", tp2: "هدف", live: "مباشر", account: "الحساب", history: "السجل", noHistory: "لا يوجد صفقات سابقة." }
    };

    function applyLanguage() {
      document.getElementById('langBtn2').innerText = currentLang === 'en' ? 'AR' : 'EN';
      if (currentLang === 'ar') document.getElementById('mainBody').classList.add('rtl');
      else document.getElementById('mainBody').classList.remove('rtl');
      
      document.getElementById('btnAnalyze').innerText = dict[currentLang].analyze;
      if (!activeTrade) document.getElementById('loadingText').innerText = dict[currentLang].loading;
      
      document.querySelectorAll('.nav-text')[0].innerText = dict[currentLang].live;
      document.querySelectorAll('.nav-text')[1].innerText = dict[currentLang].history;
      document.querySelectorAll('.nav-text')[2].innerText = dict[currentLang].account;
      
      if (activeTrade) renderTradeCard(activeTrade); 
      renderHistoryList();
    }

    function toggleLanguage() {
      currentLang = currentLang === 'en' ? 'ar' : 'en';
      localStorage.setItem('lang', currentLang);
      applyLanguage();
    }

    function initApp() {
      if (chart) return; 
      
      chart = LightweightCharts.createChart(document.getElementById('chart-container'), {
        layout: { background: { type: 'solid', color: '#000000' }, textColor: '#888' },
        grid: { vertLines: { color: '#111' }, horzLines: { color: '#111' } },
        timeScale: { borderColor: '#222', timeVisible: true },
        rightPriceScale: { borderColor: '#222' },
        autoSize: true,
      });
      candleSeries = chart.addCandlestickSeries({
        upColor: '#ffd700', downColor: '#555', borderUpColor: '#ffd700', borderDownColor: '#555', wickUpColor: '#ffd700', wickDownColor: '#555',
      });
      
      applyLanguage();
      
      setTimeout(() => {
        loadChartData(currentTF).then(() => { if (activeTrade) drawTradeLines(activeTrade); });
      }, 100);
      
      startLiveTracking();
    }

    function switchTab(tabId, element) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + tabId).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      element.classList.add('active');
      if (tabId === 'live' && chart) setTimeout(() => chart.applyOptions({ width: document.getElementById('chart-container').clientWidth }), 50);
    }

    function selectTF(tf, btn) {
      currentTF = tf;
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadChartData(tf); 
    }

    async function loadChartData(tf) {
      try {
        const res = await fetch(`https://api.twelvedata.com/time_series?symbol=XAU/USD&interval=${tf}&outputsize=300&apikey=${TWELVEDATA_API_KEY}`);
        const data = await res.json();

        if (data.status === 'error') {
          console.log("API Error: " + data.message);
          return null;
        }

        const bars = data.values.map(item => ({
          time: new Date(item.datetime).getTime() / 1000,
          open: parseFloat(item.open), 
          high: parseFloat(item.high), 
          low: parseFloat(item.low), 
          close: parseFloat(item.close)
        })).reverse(); 

        candleSeries.setData(bars);
        chart.timeScale().setVisibleLogicalRange({ from: bars.length - 60, to: bars.length + 10 });

        if (activeTrade && activeTrade.status === 'PENDING') {
          const lastBar = bars[bars.length - 1];
          let touched = false;
          if (activeTrade.dir === 'BUY' && lastBar.low <= activeTrade.entry) touched = true;
          if (activeTrade.dir === 'SELL' && lastBar.high >= activeTrade.entry) touched = true;
          
          if (touched) {
            activeTrade.status = 'ACTIVE';
            localStorage.setItem('activeTrade', JSON.stringify(activeTrade));
            renderTradeCard(activeTrade);
          }
        }
        return bars;
      } catch (e) { 
        return null; 
      }
    }

    // --- THE SNIPER LOGIC (Supply / Demand) ---
    async function startAnalysis() {
      if (activeTrade) {
        const confirmReset = confirm(currentLang === 'ar' ? "هل تريد حذف الصفقة والبحث عن جديدة؟" : "Delete current trade and scan again?");
        if (!confirmReset) return;
      }
      
      document.getElementById('signalBox').innerHTML = `<div class="loading">${dict[currentLang].scanning}</div>`;
      priceLines.forEach(line => candleSeries.removePriceLine(line));
      priceLines = [];
      activeTrade = null;
      localStorage.removeItem('activeTrade');
      window.history.replaceState({}, document.title, window.location.pathname);

      const bars = await loadChartData(currentTF);
      if (!bars || bars.length === 0) {
        document.getElementById('signalBox').innerHTML = `<div class="loading text-red">Failed to load chart. Wait 1 minute and refresh.</div>`;
        return;
      }

      if (userTries > 0) {
        userTries--;
        updateTryText();
        if (supabaseClient) {
          await supabaseClient.auth.updateUser({ data: { tries_left: userTries } });
        }
      }

      // 1. Calculate Trend using EMA 20
      const closes = bars.map(b => b.close);
      const lastBar = bars[bars.length - 1];
      const ema20 = closes.reduce((a, b) => a + b, 0) / 20; 
      let trendDir = lastBar.close > ema20 ? "BUY" : "SELL";

      // 2. Find Liquidity Sweeps & Structure (Look back 30 candles)
      const lookback = 30;
      const recentBars = bars.slice(-lookback);
      
      const recentHigh = Math.max(...recentBars.map(b => b.high));
      const recentLow = Math.min(...recentBars.map(b => b.low));

      // 3. Determine Entry (Pending Limit Orders)
      let dir, entry, sl, tp1, tp2;
      
      if (lastBar.high > recentHigh && lastBar.close < recentHigh) {
        dir = "SELL"; 
        entry = recentHigh + 0.2; 
      } else if (lastBar.low < recentLow && lastBar.close > recentLow) {
        dir = "BUY"; 
        entry = recentLow - 0.2; 
      } else {
        // If no sweep, use trend direction and recent structure
        if (trendDir === "SELL") {
            dir = "SELL";
            entry = recentHigh + 0.2;
        } else {
            dir = "BUY";
            entry = recentLow - 0.2;
        }
      }

      // 4. Calculate SL and TP
      if (dir === "SELL") {
        sl = entry + 2.5; // Stop loss above the recent high
        const risk = sl - entry;
        tp1 = entry - (risk * 1.5);
        tp2 = entry - (risk * 2.5);
      } else {
        sl = entry - 2.5; // Stop loss below the recent low
        const risk = entry - sl;
        tp1 = entry + (risk * 1.5);
        tp2 = entry + (risk * 2.5);
      }

      activeTrade = { id: Date.now(), dir, entry, sl, tp1, tp2, tf: currentTF, status: 'PENDING', date: new Date().toLocaleString() };
      
      localStorage.setItem('activeTrade', JSON.stringify(activeTrade));
      const urlParams = new URLSearchParams(window.location.search);
      urlParams.set('t', encodeURIComponent(JSON.stringify(activeTrade)));
      window.history.replaceState({}, '', `${window.location.pathname}?${urlParams.toString()}`);
      
      renderTradeCard(activeTrade);
    }

    function drawTradeLines(trade) {
      priceLines.forEach(line => candleSeries.removePriceLine(line));
      priceLines = [];
      priceLines.push(candleSeries.createPriceLine({ price: trade.entry, color: '#ffd700', lineWidth: 2, lineStyle: 2, title: 'ENTRY' }));
      priceLines.push(candleSeries.createPriceLine({ price: trade.sl, color: '#ef5350', lineWidth: 1, lineStyle: 2, title: 'SL' }));
      priceLines.push(candleSeries.createPriceLine({ price: trade.tp1, color: '#26a69a', lineWidth: 1, lineStyle: 2, title: 'TP1' }));
      priceLines.push(candleSeries.createPriceLine({ price: trade.tp2, color: '#26a69a', lineWidth: 1, lineStyle: 2, title: 'TP2' }));
    }

    function renderTradeCard(trade) {
      const isBuy = trade.dir === 'BUY';
      let statusClass = "status-pending";
      let statusText = dict[currentLang].pending;
      
      if (trade.status === 'ACTIVE') {
        statusClass = isBuy ? "status-active-buy" : "status-active-sell";
        statusText = isBuy ? dict[currentLang].activeBuy : dict[currentLang].activeSell;
      }
      
      const pipsRisk = (Math.abs(trade.entry - trade.sl) * 10).toFixed(0);
      const pipsReward1 = (Math.abs(trade.tp1 - trade.entry) * 10).toFixed(0);
      const pipsReward2 = (Math.abs(trade.tp2 - trade.entry) * 10).toFixed(0);

      document.getElementById('signalBox').innerHTML = `
        <div class="signal-card ${isBuy ? '' : 'sell'}">
          <div style="display: flex; justify-content: space-between; margin-bottom: 12px; align-items: flex-start;">
            <div>
              <div style="font-size: 18px; font-weight: 700; margin-bottom: 4px;">XAUUSD <span class="${isBuy ? 'text-green' : 'text-red'}">${isBuy ? dict[currentLang].buy : dict[currentLang].sell}</span></div>
              <div class="status-badge ${statusClass}">${statusText}</div>
            </div>
            <div style="font-size: 12px; color: #888; font-weight: 600; text-align: ${currentLang === 'ar' ? 'left' : 'right'};">${trade.tf.toUpperCase()} <br> CHART</div>
          </div>
          <div class="price-grid">
            <div class="price-box"><div class="price-label">${dict[currentLang].entry}</div><div class="price-val text-yellow">${trade.entry.toFixed(2)}</div></div>
            <div class="price-box"><div class="price-label">${dict[currentLang].sl}</div><div class="price-val text-red">${trade.sl.toFixed(2)}</div><div class="pips-sub text-red">-${pipsRisk} pips</div></div>
            <div class="price-box tp1"><div class="price-label">${dict[currentLang].tp1} 1</div><div class="price-val text-green">${trade.tp1.toFixed(2)}</div><div class="pips-sub text-green">+${pipsReward1} pips</div></div>
            <div class="price-box tp2"><div class="price-label">${dict[currentLang].tp2} 2</div><div class="price-val text-green">${trade.tp2.toFixed(2)}</div><div class="pips-sub text-green">+${pipsReward2} pips</div></div>
          </div>
        </div>
      `;
      drawTradeLines(trade);
    }

    function renderHistoryList() {
      const list = document.getElementById('historyList');
      
      let wins = 0;
      let totalPips = 0;
      const totalTrades = tradeHistory.length;

      tradeHistory.forEach(t => {
        const pips = Math.abs(t.exitPrice - t.entry) * 10;
        if (t.result === 'WIN') {
          wins++;
          totalPips += pips;
        } else {
          totalPips -= pips;
        }
      });

      const winRate = totalTrades > 0 ? ((wins / totalTrades) * 100).toFixed(1) : 0;
      
      document.getElementById('statWinRate').innerText = winRate + '%';
      document.getElementById('statTotalTrades').innerText = totalTrades;
      
      const pipsElement = document.getElementById('statTotalPips');
      pipsElement.innerText = (totalPips > 0 ? '+' : '') + totalPips.toFixed(0);
      pipsElement.className = totalPips >= 0 ? 'stat-value text-green' : 'stat-value text-red';

      if (totalTrades === 0) {
        list.innerHTML = `<div class="loading">${dict[currentLang].noHistory}</div>`;
        return;
      }
      
      const sorted = [...tradeHistory].reverse();
      let html = '';
      sorted.forEach(t => {
        const isBuy = t.dir === 'BUY';
        const isWin = t.result === 'WIN';
        const color = isWin ? 'text-green' : 'text-red';
        const sign = isWin ? '+' : '-';
        const pips = (Math.abs(t.exitPrice - t.entry) * 10).toFixed(0);

        html += `
          <div class="history-item">
            <div>
              <div class="history-title">XAUUSD <span class="${isBuy ? 'text-green' : 'text-red'}">${isBuy ? dict[currentLang].buy : dict[currentLang].sell}</span></div>
              <div class="history-date">${t.date} | ${t.tf.toUpperCase()}</div>
            </div>
            <div>
              <div class="history-result ${color}">${t.result}</div>
              <div class="history-date ${color}">${sign}${pips} Pips</div>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    function startLiveTracking() {
      if (liveInterval) clearInterval(liveInterval);
      
      liveInterval = setInterval(async () => {
        if (!activeTrade) return;
        try {
          const res = await fetch(`https://api.twelvedata.com/price?symbol=XAU/USD&apikey=${TWELVEDATA_API_KEY}`);
          const data = await res.json();
          
          if (data.status === 'error' || !data.price) return; 
          
          const livePrice = parseFloat(data.price);
          
          let result = null;
          let exitPrice = 0;
          
          if (activeTrade.dir === 'BUY') {
            if (livePrice <= activeTrade.sl) { result = 'LOSS'; exitPrice = activeTrade.sl; }
            if (livePrice >= activeTrade.tp2) { result = 'WIN'; exitPrice = activeTrade.tp2; }
          } else {
            if (livePrice >= activeTrade.sl) { result = 'LOSS'; exitPrice = activeTrade.sl; }
            if (livePrice <= activeTrade.tp2) { result = 'WIN'; exitPrice = activeTrade.tp2; }
          }

          if (result) {
            const finishedTrade = { ...activeTrade, result: result, exitPrice: exitPrice };
            tradeHistory.push(finishedTrade);
            localStorage.setItem('tradeHistory', JSON.stringify(tradeHistory));
            
            localStorage.removeItem('activeTrade');
            activeTrade = null;
            window.history.replaceState({}, document.title, window.location.pathname);
            
            alert(`TRADE HIT ${result === 'WIN' ? 'TAKE PROFIT' : 'STOP LOSS'}!`);
            location.reload();
          } else if (activeTrade.status === 'ACTIVE') {
            renderTradeCard(activeTrade, livePrice);
          }
        } catch (e) { }
      }, 15000); 
    }
  </script>
</body>
</html>
