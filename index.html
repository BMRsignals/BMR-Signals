<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MR.Trader AI</title>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0; background: #000000; color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh; padding-bottom: 90px;
    }
    
    /* Pages */
    .page { display: none; padding: 16px; animation: fadeIn 0.3s; }
    .page.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

    /* Header */
    header { padding: 16px; border-bottom: 1px solid #1a1a1a; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 18px; font-weight: 700; }
    .live-dot { display: inline-block; width: 8px; height: 8px; background: #26a69a; border-radius: 50%; margin-right: 6px; box-shadow: 0 0 8px #26a69a; animation: pulse 2s infinite; }
    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* Timeframe Selector */
    .tf-selector { display: flex; overflow-x: auto; padding: 10px 16px; gap: 8px; border-bottom: 1px solid #1a1a1a; scrollbar-width: none; }
    .tf-selector::-webkit-scrollbar { display: none; }
    .tf-btn { background: #111; border: 1px solid #333; color: #888; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; }
    .tf-btn.active { background: #ffd700; border-color: #ffd700; color: #000; }

    /* Analyze Button */
    .btn-analyze { width: 100%; padding: 16px; background: #222; color: #fff; border: none; border-top: 1px solid #333; font-size: 16px; font-weight: 700; cursor: pointer; letter-spacing: 1px; transition: 0.2s; }
    .btn-analyze:active { background: #ffd700; color: #000; }

    /* Chart */
    #chart-container { width: 100%; height: 35vh; border-bottom: 1px solid #1a1a1a; }

    /* Signal Card */
    .signal-card { background: linear-gradient(145deg, #111a14 0%, #0a0f0c 100%); border: 1px solid #1e3a2a; border-radius: 16px; padding: 16px; box-shadow: 0 8px 24px rgba(0,0,0,0.4); margin-top: 16px; }
    .signal-card.sell { background: linear-gradient(145deg, #1a1111 0%, #0f0a0a 100%); border-color: #3a1e1e; }
    .price-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
    .price-box { background: #000; border: 1px solid #222; border-radius: 12px; padding: 12px; }
    .price-box.tp1 { grid-column: span 1; border-color: #26a69a44; }
    .price-box.tp2 { grid-column: span 1; border-color: #26a69a88; }
    .price-label { font-size: 10px; color: #888; text-transform: uppercase; }
    .price-val { font-size: 18px; font-weight: 700; margin-top: 4px; }
    .pips-sub { font-size: 11px; font-weight: 600; margin-top: 4px; }

    /* Utils */
    .text-green { color: #26a69a; } .text-red { color: #ef5350; } .text-yellow { color: #ffd700; }
    .loading { text-align: center; padding: 40px; color: #888; font-weight: 600; }

    /* Bottom Navigation */
    .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; height: 65px; background: #0a0a0a; border-top: 1px solid #222; display: flex; justify-content: space-around; align-items: center; z-index: 100; }
    .nav-item { color: #666; text-align: center; font-size: 10px; font-weight: 600; text-transform: uppercase; cursor: pointer; }
    .nav-item.active { color: #ffd700; }
    .nav-icon { font-size: 20px; margin-bottom: 4px; display: block; }

    /* Unlock Bar */
    .unlock-bar { position: fixed; bottom: 65px; left: 0; width: 100%; padding: 12px 16px; background: linear-gradient(to top, #000 80%, transparent); z-index: 99; display: none; gap: 12px; }
    .btn-gold { flex: 1; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(90deg, #d4af37, #ffd700); color: #000; font-weight: 700; font-size: 16px; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>MR.Trader <span class="text-yellow">AI</span></h1>
  </header>

  <!-- PAGE 1: LIVE SIGNAL -->
  <div id="page-live" class="page active" style="padding: 0;">
    
    <!-- Timeframe Buttons -->
    <div class="tf-selector" id="tfSelector">
      <button class="tf-btn active" onclick="selectTF('5m', this)">M5</button>
      <button class="tf-btn" onclick="selectTF('15m', this)">M15</button>
      <button class="tf-btn" onclick="selectTF('30m', this)">M30</button>
      <button class="tf-btn" onclick="selectTF('1h', this)">1H</button>
      <button class="tf-btn" onclick="selectTF('4h', this)">4H</button>
      <button class="tf-btn" onclick="selectTF('1d', this)">1D</button>
    </div>

    <!-- Main Action Button -->
    <button class="btn-analyze" id="btnAnalyze" onclick="analyzeMarket()">⚡ ANALYZE MARKET</button>

    <div id="chart-container"></div>

    <div style="padding: 16px;">
      <div id="signalBox">
        <div class="loading">Select a timeframe and click Analyze.</div>
      </div>
    </div>
  </div>

  <!-- PAGE 2: HISTORY -->
  <div id="page-history" class="page">
    <h2 style="font-size: 18px; margin-bottom: 16px;">Recent AI Signals</h2>
    <div class="history-card"><div>XAUUSD <span class="text-green">BUY</span></div><div class="text-green">+45 Pips</div></div>
    <div class="history-card"><div>XAUUSD <span class="text-red">SELL</span></div><div class="text-green">+120 Pips</div></div>
  </div>

  <!-- PAGE 3: PERFORMANCE -->
  <div id="page-performance" class="page">
    <h2 style="font-size: 18px; margin-bottom: 16px;">AI Performance</h2>
    <div class="perf-grid">
      <div class="perf-box"><div style="font-size: 12px; color: #888;">Total Pips</div><div class="perf-val text-green">+12,450</div></div>
      <div class="perf-box"><div style="font-size: 12px; color: #888;">Win Rate</div><div class="perf-val">74%</div></div>
    </div>
  </div>

  <!-- PAGE 4: SUBSCRIPTION -->
  <div id="page-account" class="page">
    <h2 style="font-size: 18px; margin-bottom: 16px;">MR.Trader Pro</h2>
    <div style="background: linear-gradient(145deg, #1a1505 0%, #000 100%); border: 1px solid #ffd70055; border-radius: 16px; padding: 20px; text-align: center;">
      <h3 style="color: #ffd700; margin: 0 0 8px 0; letter-spacing: 1px;">PRO MEMBER</h3>
      <div style="font-size: 32px; font-weight: 700;">$49<span style="font-size: 14px; color: #888;">/mo</span></div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION -->
  <div class="bottom-nav">
    <div class="nav-item active" onclick="switchTab('live', this)"><span class="nav-icon">⚡</span> Live</div>
    <div class="nav-item" onclick="switchTab('history', this)"><span class="nav-icon">🕒</span> History</div>
    <div class="nav-item" onclick="switchTab('performance', this)"><span class="nav-icon">📈</span> Stats</div>
    <div class="nav-item" onclick="switchTab('account', this)"><span class="nav-icon">👤</span> Account</div>
  </div>

  <script>
    let currentTF = '5m';
    let chart, candleSeries;
    let priceLines = []; // Array to store lines so we can clear them

    // --- 1. Navigation Logic ---
    function switchTab(tabId, element) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.getElementById('page-' + tabId).classList.add('active');
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      element.classList.add('active');

      if (tabId === 'live') {
        setTimeout(() => chart.applyOptions({ width: document.getElementById('chart-container').clientWidth }), 50);
      }
    }

    // --- 2. Chart Setup ---
    const chartContainer = document.getElementById('chart-container');
    chart = LightweightCharts.createChart(chartContainer, {
      layout: { background: { type: 'solid', color: '#000000' }, textColor: '#888' },
      grid: { vertLines: { color: '#111' }, horzLines: { color: '#111' } },
      timeScale: { borderColor: '#222', timeVisible: true },
      rightPriceScale: { borderColor: '#222' },
      autoSize: true,
    });

    candleSeries = chart.addCandlestickSeries({
      upColor: '#ffd700', downColor: '#555',
      borderUpColor: '#ffd700', borderDownColor: '#555',
      wickUpColor: '#ffd700', wickDownColor: '#555',
    });

    // --- 3. Select Timeframe ---
    function selectTF(tf, btn) {
      currentTF = tf;
      document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('signalBox').innerHTML = `<div class="loading">Click 'Analyze Market' to scan ${tf.toUpperCase()}...</div>`;
    }

    // --- 4. Core Engine ---
    function calculateEMA(data, period) {
      const k = 2 / (period + 1);
      let emaArray = [data[0]];
      for (let i = 1; i < data.length; i++) emaArray.push((data[i] * k) + (emaArray[i - 1] * (1 - k)));
      return emaArray[emaArray.length - 1];
    }

    async function analyzeMarket() {
      document.getElementById('signalBox').innerHTML = `<div class="loading">Scanning ${currentTF.toUpperCase()} Market Structure...</div>`;
      
      // Clear old lines from chart
      priceLines.forEach(line => candleSeries.removePriceLine(line));
      priceLines = [];

      try {
        const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=PAXGUSDT&interval=${currentTF}&limit=300`);
        const data = await response.json();

        const bars = data.map(item => ({
          time: item[0] / 1000,
          open: parseFloat(item[1]), high: parseFloat(item[2]), low: parseFloat(item[3]), close: parseFloat(item[4])
        }));

        candleSeries.setData(bars);
        chart.timeScale().setVisibleLogicalRange({ from: bars.length - 60, to: bars.length + 10 });

        const closes = bars.map(b => b.close);
        const lastBar = bars[bars.length - 1];
        
        // Trend Logic
        const ema20 = calculateEMA(closes, 20);
        const ema50 = calculateEMA(closes, 50);
        let trendDir = (lastBar.close > ema20 && ema20 > ema50) ? 1 : (lastBar.close < ema20 && ema20 < ema50) ? -1 : 0;
        let finalDir = trendDir === 1 ? "BUY" : trendDir === -1 ? "SELL" : (lastBar.close > ema50 ? "BUY" : "SELL");
        
        // --- SNIPER ENTRY LOGIC ---
        // Instead of buying at current price, we buy on a pullback to the EMA 20
        const entry = ema20; 
        
        // Calculate True Range for ATR
        let trSum = 0;
        for (let i = bars.length - 14; i < bars.length; i++) {
          trSum += Math.max(bars[i].high - bars[i].low, Math.abs(bars[i].high - bars[i-1].close), Math.abs(bars[i].low - bars[i-1].close));
        }
        const atr = trSum / 14;
        
        let stopLoss, takeProfit1, takeProfit2;
        
        // Tight SL (1.0x ATR) below the Entry
        if (finalDir === 'BUY') {
          stopLoss = entry - (atr * 1.0);
          const risk = entry - stopLoss;
          takeProfit1 = entry + (risk * 1.5);
          takeProfit2 = entry + (risk * 2.5);
        } else {
          stopLoss = entry + (atr * 1.0);
          const risk = stopLoss - entry;
          takeProfit1 = entry - (risk * 1.5);
          takeProfit2 = entry - (risk * 2.5);
        }

        // Gold Pips (x10)
        const pipsRisk = (Math.abs(entry - stopLoss) * 10).toFixed(0);
        const pipsReward1 = (Math.abs(takeProfit1 - entry) * 10).toFixed(0);
        const pipsReward2 = (Math.abs(takeProfit2 - entry) * 10).toFixed(0);

        // Draw Lines & Store them
        priceLines.push(candleSeries.createPriceLine({ price: entry, color: '#ffd700', lineWidth: 2, lineStyle: 2, title: 'ENTRY' }));
        priceLines.push(candleSeries.createPriceLine({ price: stopLoss, color: '#ef5350', lineWidth: 1, lineStyle: 2, title: 'SL' }));
        priceLines.push(candleSeries.createPriceLine({ price: takeProfit1, color: '#26a69a', lineWidth: 1, lineStyle: 2, title: 'TP1' }));
        priceLines.push(candleSeries.createPriceLine({ price: takeProfit2, color: '#26a69a', lineWidth: 1, lineStyle: 2, title: 'TP2' }));

        const isBuy = finalDir === 'BUY';

        // Render Card
        document.getElementById('signalBox').innerHTML = `
          <div class="signal-card ${isBuy ? '' : 'sell'}">
            <div style="display: flex; justify-content: space-between; margin-bottom: 12px;">
              <div style="font-size: 18px; font-weight: 700;">XAUUSD <span class="${isBuy ? 'text-green' : 'text-red'}">${finalDir}</span></div>
              <div style="font-size: 12px; color: #888; font-weight: 600;">${currentTF.toUpperCase()} SNIPER</div>
            </div>

            <div class="price-grid">
              <div class="price-box">
                <div class="price-label">Sniper Entry</div>
                <div class="price-val text-yellow">${entry.toFixed(2)}</div>
                <div class="pips-sub" style="color:#888;">(Wait for pullback)</div>
              </div>
              
              <div class="price-box">
                <div class="price-label">Stop Loss</div>
                <div class="price-val text-red">${stopLoss.toFixed(2)}</div>
                <div class="pips-sub text-red">-${pipsRisk} pips</div>
              </div>
              
              <div class="price-box tp1">
                <div class="price-label">Take Profit 1</div>
                <div class="price-val text-green">${takeProfit1.toFixed(2)}</div>
                <div class="pips-sub text-green">+${pipsReward1} pips</div>
              </div>
              
              <div class="price-box tp2">
                <div class="price-label">Take Profit 2</div>
                <div class="price-val text-green">${takeProfit2.toFixed(2)}</div>
                <div class="pips-sub text-green">+${pipsReward2} pips</div>
              </div>
            </div>
          </div>
        `;

      } catch (error) {
        console.error(error);
        document.getElementById('signalBox').innerHTML = `<div class="loading text-red">Error analyzing market.</div>`;
      }
    }
  </script>
</body>
</html>
